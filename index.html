<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jacqui Helen Minchola - Tu Asesora Patrimonial</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="card-container">
        <header class="card-header">
            <div class="header-bg">
                <img src="fondo.jpg" alt="Fondo de mapa mundial">
            </div>
            <div class="profile-pic-container">
                <img src="perfil.png" alt="Jacqui Helen Minchola" class="profile-pic">
            </div>
        </header>

        <section class="profile-info">
            <h1>JACQUELINE<br> HELEN<br>MINCHOLA</h1>
            <p class="subtitle">SEGUROS E INVERSIONES</p>
        </section>

        <section class="main-action">
            <!-- Enlace corregido con el signo "?" necesario para WhatsApp -->
            <a href="https://wa.me." target="_blank" class="btn-primary">
                AGENDAR CITA GRATUITA
            </a>
        </section>

        <nav class="social-links">
            <a href="https://www.linkedin.com/in/jacqueline-minchola-71516a193" target="_blank" class="link-item">
                <span class="icon-box"><i class="fab fa-linkedin-in"></i></span>
                <span class="link-text">LINKEDIN</span>
            </a>
            <a href="https://www.instagram.com/JACQUIHELEN_AF" target="_blank" class="link-item">
                <span class="icon-box"><i class="fab fa-instagram"></i></span>
                <span class="link-text">INSTAGRAM</span>
            </a>
            <a href="https://www.facebook.com/100064883567557/" target="_blank" class="link-item">
                <span class="icon-box"><i class="fab fa-facebook-f"></i></span>
                <span class="link-text">FACEBOOK</span>
            </a>
        </nav>

        <!-- NUEVO: Sección del Formulario de Contacto Conectado a Formspree -->
        <section class="contact-form-section">
            <h2>Escríbeme directamente</h2>
            <!-- REEMPLAZA TU_ID_DE_FORMSPREE con el código que te dé Formspree -->
            <form action="https://formspree.io" method="POST" class="contact-form">
                <div class="form-group">
                    <input type="text" name="name" placeholder="Tu Nombre" required>
                </div>
                <div class="form-group">
                    <input type="email" name="_replyto" placeholder="Tu Correo Electrónico" required>
                </div>
                <div class="form-group">
                    <textarea name="message" rows="4" placeholder="¿En qué puedo ayudarte?" required></textarea>
                </div>
                <button type="submit" class="btn-submit">ENVIAR MENSAJE</button>
            </form>
        </section>

        <footer class="card-footer">
            <img src="logo.png" alt="Tu Asesora Patrimonial Logo" class="footer-logo">
        </footer>
    </div>

</body>
</html>
